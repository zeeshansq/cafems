{# htmx partial: estimate counter #}
{% load static %}
<div class="p-2">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <div>
      <div class="text-xs text-muted text-uppercase fw-bold">Catering Progress</div>
      <div class="fs-4 fw-bold text-dark">
        <span class="text-success">{{ issued }}</span> <span class="fs-6 text-muted">/ {{ planned }} Meals</span>
      </div>
    </div>
    <div class="text-end">
      <span class="badge {% if pct >= 90 %}bg-danger{% elif pct >= 70 %}bg-warning text-dark{% else %}bg-success{% endif %} fs-6 px-2.5 py-1">
        {{ pct|floatformat:0 }}% Capacity
      </span>
    </div>
  </div>

  {# Progress bar #}
  <div class="progress mb-3" style="height:10px;background:var(--clr-border);border-radius:999px;overflow:hidden;">
    <div class="progress-bar {% if pct >= 90 %}bg-danger{% elif pct >= 70 %}bg-warning{% else %}bg-success{% endif %}"
         role="progressbar"
         style="width: {{ pct|floatformat:0 }}%;transition:width 0.4s ease;"
         aria-valuenow="{{ pct }}" aria-valuemin="0" aria-valuemax="100"></div>
  </div>

  <div class="row g-2 text-center">
    <div class="col-4">
      <div class="p-2 rounded bg-surface-2 border">
        <div class="text-xs text-muted">Planned</div>
        <div class="fw-bold text-dark fs-6">{{ planned }}</div>
      </div>
    </div>
    <div class="col-4">
      <div class="p-2 rounded bg-success-subtle border border-success-subtle">
        <div class="text-xs text-success fw-semibold">Issued</div>
        <div class="fw-bold text-success fs-6">{{ issued }}</div>
      </div>
    </div>
    <div class="col-4">
      <div class="p-2 rounded bg-warning-subtle border border-warning-subtle">
        <div class="text-xs text-warning-emphasis fw-semibold">Remaining</div>
        <div class="fw-bold text-dark fs-6">{{ remaining }}</div>
      </div>
    </div>
  </div>

  {% if planned == 0 %}
    <div class="mt-3">
      <a href="{% url 'menu:daily_estimate_create' %}" class="btn btn-sm btn-primary w-100 fw-bold" id="btnSetEstimate">
        <i class="bi bi-plus-lg me-1"></i>Configure Today's Catering Estimate
      </a>
    </div>
  {% endif %}
</div>
