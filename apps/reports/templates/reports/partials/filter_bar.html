<div class="card shadow-sm mb-4 border-0 bg-body-tertiary">
  <div class="card-body p-3">
    <form method="get" action="" id="reportFilterForm" class="row g-2 align-items-end">

      {# Start Date #}
      <div class="col-md-2 col-lg-2">
        <label class="form-label small fw-bold text-body-secondary mb-1">Start Date</label>
        <input type="date" name="start_date" value="{{ start_date|date:'Y-m-d' }}" class="form-control form-control-sm">
      </div>

      {# End Date #}
      <div class="col-md-2 col-lg-2">
        <label class="form-label small fw-bold text-body-secondary mb-1">End Date</label>
        <input type="date" name="end_date" value="{{ end_date|date:'Y-m-d' }}" class="form-control form-control-sm">
      </div>

      {# Department Filter #}
      <div class="col-md-2 col-lg-2">
        <label class="form-label small fw-bold text-body-secondary mb-1">Department</label>
        <select name="department_id" class="form-select form-select-sm">
          <option value="">-- All Departments --</option>
          {% for dept in all_departments %}
            <option value="{{ dept.id }}" {% if current_dept_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
          {% endfor %}
        </select>
      </div>

      {# Employee Filter #}
      <div class="col-md-3 col-lg-3">
        <label class="form-label small fw-bold text-body-secondary mb-1">Employee Member</label>
        <select name="employee_id" class="form-select form-select-sm">
          <option value="">-- All Employees --</option>
          {% for emp in all_employees %}
            <option value="{{ emp.id }}" {% if current_emp_id == emp.id %}selected{% endif %}>
              {{ emp.full_name }} ({{ emp.pno|default:"—" }})
            </option>
          {% endfor %}
        </select>
      </div>

      {# Text Search Query #}
      <div class="col-md-2 col-lg-2">
        <label class="form-label small fw-bold text-body-secondary mb-1">Search Keywords</label>
        <input type="text" name="q" value="{{ q }}" class="form-control form-control-sm" placeholder="Name, P-No, Item...">
      </div>

      {# Issuance Category Filter (Tokens, POS, All) #}
      {% if report_type == 'emp_issuance' %}
      <div class="col-md-2 col-lg-2">
        <label class="form-label small fw-bold text-body-secondary mb-1">Issuance Type</label>
        <select name="issuance_type" class="form-select form-select-sm fw-bold">
          <option value="tokens" {% if issuance_type == 'tokens' or not issuance_type %}selected{% endif %}>Lunch Tokens Only</option>
          <option value="pos" {% if issuance_type == 'pos' %}selected{% endif %}>POS Purchases Only</option>
          <option value="all" {% if issuance_type == 'all' %}selected{% endif %}>All (Tokens & POS)</option>
        </select>
      </div>
      {% endif %}

      {# Actions #}
      <div class="col-md-1 col-lg-1 d-flex gap-1">
        <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">
          <i class="bi bi-funnel-fill"></i>
        </button>
        <a href="?" class="btn btn-outline-secondary btn-sm" title="Reset Filters">
          <i class="bi bi-arrow-counterclockwise"></i>
        </a>
      </div>

    </form>
  </div>
</div>
