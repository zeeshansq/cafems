[tool:pytest]
DJANGO_SETTINGS_MODULE = cafems.settings.development
python_files = tests/test_*.py apps/*/tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts = --reuse-db -v --tb=short

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */admin.py
    manage.py

[coverage:report]
show_missing = True
skip_covered = False

[isort]
profile = black
known_third_party = django,rest_framework,celery
known_first_party = apps,cafems

[flake8]
max-line-length = 120
exclude = .git,__pycache__,*/migrations/*,staticfiles,media
