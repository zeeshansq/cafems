{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 – Forbidden | CafeMS</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--clr-bg); }
    .error-card { text-align: center; max-width: 460px; padding: 3rem 2rem; }
    .error-code { font-size: 7rem; font-weight: 900; color: var(--clr-danger); line-height: 1; opacity: 0.15; }
    .error-icon { font-size: 3.5rem; color: var(--clr-danger); margin: -1rem 0 1rem; }
    .error-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .error-desc { color: var(--clr-text-muted); margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">403</div>
    <div class="error-icon"><i class="bi bi-shield-lock-fill"></i></div>
    <h1 class="error-title">Access Denied</h1>
    <p class="error-desc">You do not have permission to access this page. If you believe this is an error, contact your administrator.</p>
    <a href="javascript:history.back()" class="btn btn-outline-secondary me-2" id="btnBack">
      <i class="bi bi-arrow-left me-1"></i>Go Back
    </a>
    <a href="/" class="btn btn-primary" id="btnHome">
      <i class="bi bi-house me-1"></i>Dashboard
    </a>
  </div>
</body>
</html>
