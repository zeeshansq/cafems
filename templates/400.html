{% extends "base.html" %}
{% load static %}

{% block title %}400 Bad Request | {{ site_name }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 text-center">
      <div class="card shadow-sm border border-secondary-subtle bg-body p-4 p-md-5 rounded-4">
        
        <div class="rounded-circle bg-secondary-subtle text-secondary mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:84px;height:84px;">
          <i class="bi bi-x-octagon-fill display-4"></i>
        </div>

        <h1 class="h3 fw-bold text-body mb-2">400 — Bad Request</h1>
        <p class="text-body-secondary mb-4">
          The server could not understand or process your request due to invalid parameters or malformed data.
        </p>

        <div class="d-flex flex-wrap gap-2 justify-content-center">
          <a href="{% url 'core:dashboard' %}" class="btn btn-secondary fw-bold px-4 py-2 shadow-sm">
            <i class="bi bi-arrow-left me-1"></i>Return to Dashboard
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
